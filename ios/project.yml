# iPad/iPhone app around the Hausakte web version, with home screen widgets.
# Generated into an Xcode project with XcodeGen (see .github/workflows/ios.yml).
name: Hausakte
options:
  bundleIdPrefix: app.hausakte
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Hausakte:
    type: application
    platform: iOS
    sources:
      - Hausakte
      - Shared
    info:
      path: Hausakte/Info.plist
      properties:
        CFBundleDisplayName: Hausakte
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: Background
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: app.hausakte
            CFBundleURLSchemes:
              - hausakte
        NSCameraUsageDescription: Zum Fotografieren von Rechnungen, Visitenkarten und Dokumenten.
        NSMicrophoneUsageDescription: Für Notizen, Besprechungen und den Assistenten per Sprache.
        NSSpeechRecognitionUsageDescription: Damit gesprochene Notizen und Befehle als Text in der Hausakte landen.
        NSPhotoLibraryUsageDescription: Um Fotos von Rechnungen und Dokumenten aus deiner Mediathek hinzuzufügen.
    entitlements:
      path: Hausakte/Hausakte.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.hausakte
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hausakte
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: HausakteWidgets
        embed: true
  HausakteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Hausakte
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.hausakte
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hausakte.widgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
schemes:
  Hausakte:
    build:
      targets:
        Hausakte: all
        HausakteWidgets: all
    archive:
      config: Release
